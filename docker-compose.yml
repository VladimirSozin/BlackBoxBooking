version: '3.8'

services:
  backend:
    build:
      context: ./BlackBoxBoard.Server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production  
    networks:
      - coolify 
    volumes:
      - app_data:/app/data

  frontend:
    build: ./blackboxboard.client
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - coolify  

networks:
  coolify:
    external: true 

volumes:
  app_data: